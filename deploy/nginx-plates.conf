server {
    listen 80;
    listen [::]:80;
    server_name plates.banas.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plates.banas.dev;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_early_data off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    access_log /var/log/nginx/plates.access.log;
    error_log  /var/log/nginx/plates.error.log;

    client_max_body_size 4m;
    client_body_timeout 10s;

    location = /api/analyze {
        access_log off;
        limit_req zone=plates_api burst=2 nodelay;
        limit_conn plates_conn 2;
        proxy_pass http://127.0.0.1:20145;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_send_timeout 12s;
        proxy_read_timeout 18s;
    }

    location / {
        proxy_pass http://127.0.0.1:20145;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
